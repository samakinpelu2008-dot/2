.container input{width:100%;padding:10px;border-radius:10px;border:none;}

<body>
<div class="container">

<script>

const firebaseConfig={apiKey:"AIzaSyDeFlOeRoiNjqH9LAclnqnehXNY6scPqzE",authDomain:"businessio-37c69.firebaseapp.com",projectId:"businessio-37c69",storageBucket:"businessio-37c69.appspot.com",messagingSenderId:"287926988132",appId:"1:287926988132:web:39c6aaf2f8994406e75e71"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

function login(){
  const email=document.getElementById('email').value;
  if(!email)return alert("Enter email");
  // Try sign-in, else create account
  auth.signInWithEmailAndPassword(email,"123456")
    .then(()=>goHome())
    .catch(()=>auth.createUserWithEmailAndPassword(email,"123456").then(()=>goHome()));
}

function goHome(){
  // Redirect to home page
  window.location.href="home.html";
}
</script>
