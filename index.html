<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Coin Platform</title>
<style>
  body { font-family: Arial, sans-serif; background:#0f0f0f; color:white; margin:0; }
  header { background:#000; padding:15px; text-align:center; border-bottom:1px solid #222; }
  .container { max-width:900px; margin:20px auto; background:#161616; padding:20px; border-radius:12px; }
  input, select, button { width:100%; padding:12px; margin:6px 0; border-radius:8px; border:none; }
  input, select { background:#222; color:white; }
  button { background:#ff0050; color:white; cursor:pointer; }
  .task { border:1px solid #333; padding:15px; border-radius:10px; margin-top:10px; }
  .coin { color:#f4b400; font-weight:bold; }
  .top { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
</style>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<header>
  <h2>🎵 TikTok Coin Platform</h2>
  <div class="top">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login / Register</button>
  </div>
  <p>🪙 Coins: <span id="coins">0</span></p>
  <input id="cheat" placeholder="Enter cheat code">
  <button onclick="applyCheat()">Apply</button>
</header>

<div class="container">
  <h3>Post TikTok Task</h3>
  <input id="link" placeholder="TikTok link">
  <select id="type">
    <option value="like">Like (2 🪙)</option>
    <option value="follow">Follow (4 🪙)</option>
  </select>
  <select id="amount">
    <option>10</option><option>20</option><option>50</option><option>100</option><option>200</option><option>500</option><option>1000</option>
  </select>
  <button onclick="postTask()">Post</button>

  <h3>Available Tasks</h3>
  <div id="tasks"></div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDeFlOeRoiNjqH9LAclnqnehXNY6scPqzE",
    authDomain: "businessio-37c69.firebaseapp.com",
    projectId: "businessio-37c69",
    storageBucket: "businessio-37c69.appspot.com",
    messagingSenderId: "287926988132",
    appId: "1:287926988132:web:39c6aaf2f8994406e75e71"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let userId = null;

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await auth.signInWithEmailAndPassword(email, password)
        .catch(() => auth.createUserWithEmailAndPassword(email, password));
    } catch(e) {
      alert(e.message);
    }
  }

  auth.onAuthStateChanged(async user => {
    if(!user) return;
    userId = user.uid;
    const userRef = db.collection('users').doc(userId);
    if(!(await userRef.get()).exists) await userRef.set({ coins: 0 });
    userRef.onSnapshot(snap => {
      document.getElementById('coins').innerText = snap.data().coins;
    });
    loadTasks();
  });

  async function applyCheat() {
    if(document.getElementById('cheat').value === 'Akinpepe100') {
      await db.collection('users').doc(userId).update({ coins: firebase.firestore.FieldValue.increment(500) });
      alert('🪙 Cheat applied +500 coins');
      document.getElementById('cheat').value = '';
    }
  }

  async function postTask() {
    const link = document.getElementById('link').value;
    const type = document.getElementById('type').value;
    const amount = parseInt(document.getElementById('amount').value);
    const cost = (type === 'like' ? 2 : 4) * amount;

    const userRef = db.collection('users').doc(userId);
    const snap = await userRef.get();
    if(snap.data().coins < cost) return alert('Not enough coins');

    await userRef.update({ coins: firebase.firestore.FieldValue.increment(-cost) });
    await db.collection('tasks').add({ link, type, remaining: amount, reward: type === 'like' ? 2 : 4 });
    document.getElementById('link').value = '';
  }

  function loadTasks() {
    const tasksDiv = document.getElementById('tasks');
    db.collection('tasks').onSnapshot(snapshot => {
      tasksDiv.innerHTML = '';
      snapshot.forEach(docSnap => {
        const t = docSnap.data();
        if(t.remaining <= 0) return;
        const div = document.createElement('div');
        div.className = 'task';
        div.innerHTML = `
          <a href="${t.link}" target="_blank">Open TikTok</a>
          <p>${t.type.toUpperCase()} | Remaining: ${t.remaining}</p>
          <p>Reward: <span class='coin'>${t.reward} 🪙</span></p>
          <button onclick="completeTask('${docSnap.id}',${t.reward})">Complete</button>
        `;
        tasksDiv.appendChild(div);
      });
    });
  }

  async function completeTask(id, reward) {
    await db.collection('users').doc(userId).update({ coins: firebase.firestore.FieldValue.increment(reward) });
    const taskRef = db.collection('tasks').doc(id);
    const snap = await taskRef.get();
    if(snap.data().remaining - 1 <= 0) await taskRef.delete();
    else await taskRef.update({ remaining: firebase.firestore.FieldValue.increment(-1) });
  }
</script>
</body>
</html>
