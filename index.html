<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TIKI BOOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}
header{
  display:flex;align-items:center;
  padding:10px;background:#000;
  position:sticky;top:0;z-index:10
}
header img{width:32px}
.search{flex:1;margin:0 10px}
.search input{
  width:100%;padding:8px;border:none;
  border-radius:8px;background:#222;color:#fff
}
.coins{padding:6px 12px;background:#222;border-radius:8px;position:relative;cursor:pointer}
.dot{width:10px;height:10px;background:red;border-radius:50%;position:absolute;top:-4px;right:-4px}

.tabs{
  display:flex;justify-content:space-around;
  background:#000;padding:6px 0
}
.tabs div{cursor:pointer;opacity:.6}
.tabs .active{opacity:1}

.feed{padding:10px}
.card{
  display:flex;align-items:center;
  background:#1b1b1b;
  padding:10px;border-radius:12px;
  margin-bottom:10px;
  transition:.2s
}
.card:hover{transform:scale(1.02)}
.thumb{
  width:50px;height:50px;border-radius:50%;
  background:#333;margin-right:10px
}
.info b{display:block}
.plus{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  width:60px;height:60px;border-radius:50%;
  background:#ff0050;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;cursor:pointer
}

.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.8);
  display:none;align-items:center;justify-content:center
}
.box{
  width:90%;max-width:400px;
  background:#222;padding:20px;
  border-radius:12px
}
.box input,.box select{
  width:100%;padding:10px;margin-bottom:10px;
  background:#111;color:#fff;border:none;border-radius:6px
}
.box button{
  width:100%;padding:10px;
  background:#ff0050;border:none;
  color:#fff;border-radius:6px
}
</style>
</head>

<body>

<header>
  <img src="https://i.ibb.co/HLHvwk7d/large-1.png">
  <div class="search"><input placeholder="Search"></div>
  <div class="coins" onclick="daily()">
    🪙 <span id="coins">0</span>
    <div id="dot" class="dot"></div>
  </div>
</header>

<div class="tabs">
  <div class="active" onclick="tab('home')">Home</div>
  <div onclick="tab('history')">History</div>
  <div onclick="tab('profile')">Profile</div>
</div>

<div id="home" class="feed"></div>
<div id="history" class="feed" style="display:none"></div>
<div id="profile" class="feed" style="display:none"></div>

<div class="plus" onclick="openPost()">+</div>

<div class="modal" id="modal">
  <div class="box">
    <input id="link" placeholder="Paste TikTok link">
    <input placeholder="Promo code (optional)">
    <select id="qty">
      <option>10</option><option>20</option><option>50</option>
      <option>100</option><option>200</option><option>500</option><option>1000</option>
    </select>
    <button onclick="post()">Next</button>
  </div>
</div>

<script>
let coins=+localStorage.coins||0;
let tasks=JSON.parse(localStorage.tasks||"[]");
let done=JSON.parse(localStorage.done||"[]");
document.getElementById("coins").innerText=coins;

function save(){
  localStorage.coins=coins;
  localStorage.tasks=JSON.stringify(tasks);
  localStorage.done=JSON.stringify(done);
  document.getElementById("coins").innerText=coins;
}

function daily(){
  if(localStorage.daily==new Date().toDateString())return;
  window.open("https://www.effectivegatecpm.com/prwmz1t9?key=17b80b2cde4a338414105a2c5427f8ce","_blank");
  setTimeout(()=>{
    let r=[5,10,20,30,50][Math.floor(Math.random()*5)];
    coins+=r;save();
    localStorage.daily=new Date().toDateString();
    document.getElementById("dot").style.display="none";
    alert("+"+r+" coins");
  },3000);
}
if(localStorage.daily!==new Date().toDateString())
  document.getElementById("dot").style.display="block";

function openPost(){modal.style.display="flex"}
function post(){
  let l=link.value;if(!l)return;
  let type=l.includes("/video/")?"LIKE":"FOLLOW";
  tasks.unshift({l,type,q:+qty.value});
  save();modal.style.display="none";render();
}

function render(){
  home.innerHTML="";
  history.innerHTML="";
  profile.innerHTML=`<h2>Coins: ${coins}</h2><p>Completed: ${done.length}</p>`;
  tasks.forEach(t=>{
    if(done.includes(t.l))return;
    let c=document.createElement("div");
    c.className="card";
    c.innerHTML=`<div class="thumb"></div>
    <div class="info"><b>${t.type}</b>${t.q} required</div>`;
    c.onclick=()=>{
      window.open(t.l,"_blank");
      setTimeout(()=>{
        coins+=t.type=="LIKE"?2:4;
        done.push(t.l);save();render();
      },3000);
    };
    home.appendChild(c);
  });
  done.forEach(l=>{
    let c=document.createElement("div");
    c.className="card";
    c.innerHTML=`<div class="thumb"></div><div>Completed</div>`;
    history.appendChild(c);
  });
}
function tab(t){
  home.style.display=history.style.display=profile.style.display="none";
  document.getElementById(t).style.display="block";
  document.querySelectorAll(".tabs div").forEach(x=>x.classList.remove("active"));
  event.target.classList.add("active");
}
render();
</script>

</body>
</html>
