<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TIKI BOOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
}

/* LOGIN */
#login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-box{
  width:90%;
  max-width:400px;
  text-align:center;
}
.login-box input{
  width:100%;
  padding:14px;
  border-radius:8px;
  border:none;
  margin-bottom:10px;
}
.login-box button{
  width:100%;
  padding:14px;
  border:none;
  background:#ff0050;
  color:#fff;
  border-radius:8px;
}

/* APP */
#app{display:none}

/* HEADER */
header{
  display:flex;
  align-items:center;
  padding:8px;
  background:#000;
  position:sticky;
  top:0;
}
header img{width:32px}

.search{
  flex:1;
  margin:0 8px;
}
.search input{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:none;
}

.coins{
  background:rgba(255,255,255,.1);
  padding:6px 10px;
  border-radius:8px;
  position:relative;
  cursor:pointer;
}
.dot{
  position:absolute;
  top:-4px;
  right:-4px;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
}

/* START CODE */
.start{
  padding:8px;
}
.start input{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:none;
}

/* FEED */
.feed{padding:10px}
.card{
  background:#1c1c1c;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.2s;
}
.card:hover{transform:scale(1.02)}

/* PLUS */
.plus{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:60px;
  height:60px;
  background:#ff0050;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  cursor:pointer;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#222;
  padding:20px;
  width:90%;
  max-width:400px;
  border-radius:12px;
}
.modal-box input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}
.modal-box button{
  width:100%;
  padding:10px;
  border:none;
  background:#ff0050;
  color:white;
  border-radius:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <img src="https://i.ibb.co/HLHvwk7d/large-1.png" width="70"><br><br>
    <input id="email" placeholder="Enter your email">
    <button onclick="login()">Continue</button>
  </div>
</div>

<!-- APP -->
<div id="app">

<header>
  <img src="https://i.ibb.co/HLHvwk7d/large-1.png">
  <div class="search"><input placeholder="Search"></div>
  <div class="coins" onclick="dailyBonus()">
    🪙 <span id="coinCount">0</span>
    <div id="bonusDot" class="dot"></div>
  </div>
</header>

<div class="start">
  <input placeholder="Enter code & press Enter" onkeydown="codeEnter(event)">
</div>

<div class="feed" id="feed"></div>

<div class="plus" onclick="openPost()">+</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <input id="postLink" placeholder="Paste TikTok link">
    <button onclick="submitPost()">Post</button>
  </div>
</div>

</div>

<script>
let user = localStorage.getItem("tb_user");
let coins = 0;
let tasks = JSON.parse(localStorage.getItem("tb_tasks")||"[]");
let done = [];

function login(){
  const email = document.getElementById("email").value.trim();
  if(!email) return alert("Enter email");
  user=email;
  localStorage.setItem("tb_user",email);
  coins = Number(localStorage.getItem("coins_"+email)||0);
  done = JSON.parse(localStorage.getItem("done_"+email)||"[]");
  showApp();
}

function showApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  updateCoins();
  checkDaily();
  render();
}

if(user){
  coins = Number(localStorage.getItem("coins_"+user)||0);
  done = JSON.parse(localStorage.getItem("done_"+user)||"[]");
  showApp();
}

function updateCoins(){
  document.getElementById("coinCount").innerText=coins;
  localStorage.setItem("coins_"+user,coins);
}

function codeEnter(e){
  if(e.key==="Enter" && e.target.value==="Akinpepe100"){
    coins+=500;
    updateCoins();
    alert("+500 coins");
    e.target.value="";
  }
}

function dailyBonus(){
  const today=new Date().toDateString();
  if(localStorage.getItem("daily_"+user)===today) return;
  const rewards=[5,10,15,20,30,50];
  const gain=rewards[Math.floor(Math.random()*rewards.length)];
  coins+=gain;
  updateCoins();
  localStorage.setItem("daily_"+user,today);
  document.getElementById("bonusDot").style.display="none";
  alert("+"+gain+" coins");
}

function checkDaily(){
  const today=new Date().toDateString();
  if(localStorage.getItem("daily_"+user)!==today){
    document.getElementById("bonusDot").style.display="block";
  }
}

function openPost(){
  document.getElementById("modal").style.display="flex";
}

function submitPost(){
  const link=document.getElementById("postLink").value;
  if(!link) return;
  const type=link.includes("/video/")?"like":"follow";
  tasks.unshift({link,type});
  localStorage.setItem("tb_tasks",JSON.stringify(tasks));
  document.getElementById("modal").style.display="none";
  render();
}

function render(){
  const feed=document.getElementById("feed");
  feed.innerHTML="";
  tasks.forEach(t=>{
    if(done.includes(t.link)) return;
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`${t.type.toUpperCase()}<br>${t.link}`;
    card.onclick=()=>{
      window.open(t.link,"_blank");
      setTimeout(()=>{
        coins+=t.type==="like"?2:4;
        done.push(t.link);
        localStorage.setItem("done_"+user,JSON.stringify(done));
        updateCoins();
        render();
      },3000);
    };
    feed.appendChild(card);
  });
}
</script>

</body>
</html>
