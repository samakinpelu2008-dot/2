<!DOCTYPE html>
<html>
<head>
<title>Football Match Simulator</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

button{
padding:10px 20px;
margin:10px;
font-size:16px;
}

#teams button{
display:block;
margin:10px auto;
width:200px;
}

#scoreboard{
font-size:40px;
margin-top:20px;
}

#events{
border:1px solid white;
height:200px;
overflow:auto;
margin-top:20px;
padding:10px;
}
</style>
</head>

<body>

<h1>Football Match Simulator</h1>

<div id="home">

<input id="roomInput" placeholder="Type Room Name (example Samuel1)">
<br><br>

<button onclick="joinRoom()">Join Room</button>

</div>

<div id="lobby" style="display:none">

<h2>Room: <span id="roomName"></span></h2>

<h3>Select Your Club</h3>

<div id="teams">

<button onclick="selectTeam('Man U',90)">Man U (90)</button>
<button onclick="selectTeam('Man C',80)">Man C (80)</button>
<button onclick="selectTeam('Arsenal',75)">Arsenal (75)</button>
<button onclick="selectTeam('Liverpool',60)">Liverpool (60)</button>

</div>

<button onclick="ready()">READY</button>

<p>Waiting for other player...</p>

</div>

<div id="match" style="display:none">

<div id="scoreboard">

<span id="team1">Team1</span>
<span id="score1">0</span>

-

<span id="score2">0</span>
<span id="team2">Team2</span>

</div>

<h2 id="time">0</h2>

<div id="events"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyDRna9X7GVgBwj5xjECu-bJYos_1UMCLh4",
authDomain: "chess-a4f8a.firebaseapp.com",
databaseURL: "https://chess-a4f8a-default-rtdb.firebaseio.com",
projectId: "chess-a4f8a",
storageBucket: "chess-a4f8a.firebasestorage.app",
messagingSenderId: "631062330530",
appId: "1:631062330530:web:f003eabd02559c9b4dabfb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let room="";
let player="";
let team="";
let rating=0;

let score1=0;
let score2=0;

window.joinRoom=function(){

room=document.getElementById("roomInput").value;

if(room=="") return;

player="player"+Math.floor(Math.random()*10000);

set(ref(db,"rooms/"+room+"/players/"+player),{
team:null,
ready:false
});

document.getElementById("home").style.display="none";
document.getElementById("lobby").style.display="block";
document.getElementById("roomName").innerText=room;

listenRoom();

}

window.selectTeam=function(t,r){

team=t;
rating=r;

update(ref(db,"rooms/"+room+"/players/"+player),{
team:t
});

}

window.ready=function(){

update(ref(db,"rooms/"+room+"/players/"+player),{
ready:true
});

}

function listenRoom(){

onValue(ref(db,"rooms/"+room+"/players"),(snapshot)=>{

let players=snapshot.val();

if(!players) return;

let list=Object.values(players);

if(list.length==2){

let ready=list.every(p=>p.ready);

if(ready){

startMatch(list);

}

}

});

}

function startMatch(players){

document.getElementById("lobby").style.display="none";
document.getElementById("match").style.display="block";

document.getElementById("team1").innerText=players[0].team;
document.getElementById("team2").innerText=players[1].team;

simulate();

}

function simulate(){

let minute=0;

let timer=setInterval(()=>{

minute++;

document.getElementById("time").innerText=minute;

event(minute);

if(minute>=90) clearInterval(timer);

},1000);

}

function event(minute){

let chance=Math.random();

if(chance<0.08){

goal(minute);

}
else if(chance<0.13){

add(minute+" 🟨 Yellow Card");

}
else if(chance<0.16){

add(minute+" 🟥 Red Card");

}
else if(chance<0.20){

add(minute+" 🚩 Corner");

}

}

function goal(minute){

if(Math.random()>0.5){

score1++;
document.getElementById("score1").innerText=score1;
add(minute+" ⚽ GOAL");

}else{

score2++;
document.getElementById("score2").innerText=score2;
add(minute+" ⚽ GOAL");

}

}

function add(text){

let box=document.getElementById("events");

box.innerHTML=text+"<br>"+box.innerHTML;

}

</script>

</body>
</html>
